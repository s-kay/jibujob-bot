<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaziLeo Partner Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Sun Orange: #FFA500 */
        /* Plant Green: #4CAF50 */
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <div class="flex items-center space-x-3 mb-6">
            <!-- KaziLeo Logo -->
            <img src="/static/kazileo-logo.png" alt="KaziLeo Logo" class="h-12 w-12" width="20" height="10">
            
        </div>
        <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Partner Dashboard Login</h2>
        
        <!-- Login Form -->
        <form action="/dashboard/token" method="post">
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" name="username" required
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="Enter your username">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" required
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
                    placeholder="******************">
            </div>
            <div class="flex items-center justify-between">
                <button type="submit"
                        class="w-full bg-[#FFA500] hover:bg-orange-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-300">
                    Sign In
                </button>
            </div>
        </form>
    </div>
</body>
</html>
